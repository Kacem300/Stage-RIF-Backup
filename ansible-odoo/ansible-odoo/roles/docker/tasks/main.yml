---
- name: Mise à jour du cache apt
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Installation des dépendances
  apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ajout de la clé GPG Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Ajout du dépôt Docker
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present

- name: Installation de Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    update_cache: yes
    state: present

- name: Démarrage et activation de Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Installation de Docker Compose (via pip)
  pip:
    name: docker-compose
    state: present

- name: Ajout de l'utilisateur ubuntu au groupe docker
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Vérification de l'installation Docker
  command: docker --version
  register: docker_ver
  changed_when: false

- debug:
    var: docker_ver.stdout
