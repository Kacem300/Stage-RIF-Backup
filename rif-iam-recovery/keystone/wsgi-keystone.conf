Listen 10.0.1.1:5000

ServerSignature Off
ServerTokens Prod
TraceEnable off
TimeOut 60
KeepAliveTimeout 60

ErrorLog "/var/log/kolla/keystone/apache-error.log"
<IfModule log_config_module>
    CustomLog "/var/log/kolla/keystone/apache-access.log" common
</IfModule>

<Directory "/var/lib/kolla/venv/bin">
    <FilesMatch "^keystone-wsgi-(public|admin)$">
        AllowOverride None
        Options None
        Require all granted
    </FilesMatch>
</Directory>

<VirtualHost *:5000>
    LimitRequestFieldSize 32768
    LimitRequestLine 32768
    WSGIDaemonProcess keystone-public processes=5 threads=1 user=keystone group=keystone display-name=keystone-public
    WSGIProcessGroup keystone-public
    WSGIScriptAlias / /var/lib/kolla/venv/bin/keystone-wsgi-public
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On
    <IfVersion >= 2.4>
      ErrorLogFormat "%{cu}t %M"
    </IfVersion>
    ErrorLog "/var/log/kolla/keystone/keystone-apache-public-error.log"
    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\"" logformat
    CustomLog "/var/log/kolla/keystone/keystone-apache-public-access.log" logformat

    # OpenID Connect federation via Keycloak
    OIDCProviderMetadataURL http://kcrif.duckdns.org:8080/realms/osc/.well-known/openid-configuration
    OIDCClientID openstack
    OIDCClientSecret Yzpa2n2Hf77ao5xjn0YTdUetM3phc8Q1
    OIDCCryptoPassphrase L1a9hpGwvd1VNPHVlkECRcQTCIOAJeFxAGRzbnhC
    OIDCRedirectURI https://195.201.169.165:5000/oidc/callback
    OIDCScope "openid email profile"
    OIDCClaimPrefix "OIDC-"
    OIDCResponseType "code"
    OIDCOAuthRemoteUserClaim sub
    OIDCPassClaimsAs environment
    OIDCStripCookies "mod_auth_openidc_session"
    OIDCXForwardedHeaders X-Forwarded-Proto X-Forwarded-Host X-Forwarded-Port
    OIDCStateMaxNumberOfCookies 20
    OIDCAuthRequestParams prompt=login
    OIDCProviderEndSessionEndpoint http://kcrif.duckdns.org:8080/realms/osc/protocol/openid-connect/logout
    OIDCDefaultLoggedOutURL https://cloud.grouperif.com/auth/login/

    <Location /v3/auth/OS-FEDERATION/identity_providers/keycloak/protocols/mapped/websso>
        AuthType openid-connect
        Require valid-user
    </Location>
    <Location /oidc/callback>
        AuthType openid-connect
        Require valid-user
    </Location>
</VirtualHost>
